<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>

    <style>
      /* Animated Background Elements (always behind text) */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-2deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.6; stroke-dashoffset: 40; }
      }
      @keyframes shimmerGrid {
        0% { opacity: 0.12; }
        50% { opacity: 0.25; }
        100% { opacity: 0.12; }
      }
      @keyframes pulsePill {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.04); opacity: 1; }
      }

      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatReverse 8s ease-in-out infinite;
        transform-origin: center;
      }
      .shimmer-line {
        stroke-dasharray: 8 12;
        animation: pulseBeam 6s linear infinite;
      }
      .grid-pattern {
        animation: shimmerGrid 5s ease-in-out infinite;
      }
      .pill-pulse {
        animation: pulsePill 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Technical Grid (Background) -->
  <g class="grid-pattern" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Flow Rays / Ambient Data Wave (Background) -->
  <path class="shimmer-line" d="M-50,290 C300,320 450,200 700,260 C950,320 1100,230 1250,270" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path class="shimmer-line" d="M-50,310 C250,240 500,330 750,240 C1000,180 1150,270 1250,250" fill="none" stroke="#818cf8" stroke-width="2" />
  <path class="shimmer-line" d="M-50,80 C350,150 550,40 850,90 C1050,120 1150,70 1250,100" fill="none" stroke="#c084fc" stroke-width="1.8" />

  <!-- Animated Ambient Data Cluster Pill (Right Side, Background layer) -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="940" y="45" width="210" height="90" rx="12" fill="url(#badge-glow)" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow)" />
    <text x="960" y="78" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">QUERY OPTIMIZER</text>
    <text x="960" y="102" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">⚡ Lazy Evaluation</text>
    <text x="960" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Predicate Pushdown</text>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <rect x="910" y="180" width="240" height="110" rx="12" fill="url(#badge-glow)" stroke="#818cf8" stroke-width="1.2" filter="url(#shadow)" />
    <text x="930" y="212" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">IN-MEMORY ARCHITECTURE</text>
    <text x="930" y="238" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">📊 Apache Arrow &amp; SIMD</text>
    <text x="930" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Zero-copy Out-of-Core Processing</text>
    <circle cx="1115" cy="210" r="4" fill="#10b981" />
    <circle cx="1115" cy="210" r="8" fill="#10b981" opacity="0.3" />
  </g>

  <!-- Left Side Visual Accent: Animated Mini Data Column Graphic -->
  <g class="floating-card-2" opacity="0.6">
    <rect x="50" y="50" width="6" height="35" rx="3" fill="#38bdf8" />
    <rect x="62" y="35" width="6" height="50" rx="3" fill="#818cf8" />
    <rect x="74" y="60" width="6" height="25" rx="3" fill="#c084fc" />
    <rect x="86" y="42" width="6" height="43" rx="3" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Badges, Titles (Unobstructed & Clean) -->
  <g id="foreground-content" transform="translate(60, 0)">
    
    <!-- Top Pill / Category Tag -->
    <g class="pill-pulse" transform="translate(0, 48)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURATED DATA ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome DataFrames &amp; Data Analysis
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
      High-Performance In-Memory Analytics, Lazy Engines &amp; Distributed Computing
    </text>

    <!-- Value Proposition Description -->
    <text x="0" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Comprehensive guide comparing Polars, Pandas, DuckDB, Spark, Dask, cuDF &amp; Cloud Lakehouses.
    </text>

    <!-- Ecosystem Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Vectorized</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="161" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚀 Multi-Threaded</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="306" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Distributed</text>

      <!-- Pill 4 -->
      <rect x="440" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="456" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Zero-Copy Arrow</text>
    </g>

    <!-- Bottom Metadata Details -->
    <text x="0" y="325" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      Open-Source Software &amp; SaaS Lakehouse Benchmarks • Continuous Community Updates
    </text>
  </g>
</svg>
